<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img" aria-label="竹叶输入法候选窗示例：候选词旁显示英文译文">
  <defs>
    <linearGradient id="cGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ac36a"/>
      <stop offset="1" stop-color="#3d7a4e"/>
    </linearGradient>
    <filter id="cShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#22302a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- 候选窗：真实布局与配色（T-030/032/037/043 锁定的验收值，见 docs/官网设计.md S-15） -->
  <g filter="url(#cShadow)">
    <rect x="20" y="70" width="380" height="196" rx="10" fill="#ffffff" stroke="#1e88e5" stroke-width="1.5"/>
    <!-- 页眉：组合串 -->
    <text x="38" y="98" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="17" font-weight="600" fill="#1e88e5">nihao</text>
    <!-- 选中行 -->
    <rect x="22" y="106" width="376" height="30" fill="#e6f2fe"/>
    <text x="40" y="126" font-family="'Segoe UI',sans-serif" font-size="13" fill="#999999">1</text>
    <text x="60" y="127" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#d32f2f">你好</text>
    <text x="384" y="126" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="13" fill="#999999">hello</text>
    <!-- 行 2 -->
    <text x="40" y="156" font-family="'Segoe UI',sans-serif" font-size="13" fill="#999999">2</text>
    <text x="60" y="157" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#1e88e5">您好</text>
    <text x="384" y="156" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="13" fill="#999999">hello</text>
    <!-- 行 3 -->
    <text x="40" y="186" font-family="'Segoe UI',sans-serif" font-size="13" fill="#999999">3</text>
    <text x="60" y="187" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#1e88e5">你好吗</text>
    <text x="384" y="186" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="13" fill="#999999">how are you</text>
    <!-- 行 4 -->
    <text x="40" y="216" font-family="'Segoe UI',sans-serif" font-size="13" fill="#999999">4</text>
    <text x="60" y="217" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="17" fill="#1e88e5">你和我</text>
    <text x="384" y="216" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="13" fill="#999999">you and me</text>
    <!-- 页脚：页码 -->
    <text x="384" y="250" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="12" fill="#999999">1/2</text>
  </g>

  <!-- 吉祥物（站姿缩放） -->
  <g transform="translate(404 168) scale(0.66)">
    <rect x="60" y="0" width="8" height="16" rx="4" fill="#9c7b4f"/>
    <path d="M 64 10 C 40 26 26 58 32 92 C 36 110 50 120 64 120 C 78 120 92 110 96 92 C 102 58 88 26 64 10 Z" fill="url(#cGrad)"/>
    <path d="M 64 14 C 62 48 66 80 60 108" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="46" cy="120" rx="11" ry="5" fill="#2c5a3b"/>
    <ellipse cx="82" cy="120" rx="11" ry="5" fill="#2c5a3b"/>
    <circle cx="52" cy="64" r="5" fill="#22302a"/>
    <circle cx="76" cy="64" r="5" fill="#22302a"/>
    <circle cx="53.5" cy="62.5" r="1.6" fill="#ffffff"/>
    <circle cx="77.5" cy="62.5" r="1.6" fill="#ffffff"/>
    <path d="M 56 76 Q 64 84 72 76" fill="none" stroke="#22302a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="44" cy="72" r="4.5" fill="#e8c9c0" opacity="0.85"/>
    <circle cx="84" cy="72" r="4.5" fill="#e8c9c0" opacity="0.85"/>
    <path d="M 44 80 C 36 84 32 86 28 84" fill="none" stroke="#2c5a3b" stroke-width="5" stroke-linecap="round"/>
    <path d="M 84 80 C 92 84 96 86 100 84" fill="none" stroke="#2c5a3b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="26" cy="84" r="5" fill="#2c5a3b"/>
    <circle cx="102" cy="84" r="5" fill="#2c5a3b"/>
  </g>

  <!-- 气泡 -->
  <g>
    <path d="M 336 52 L 348 78 L 366 52 Z" fill="#ffffff" stroke="#3d7a4e" stroke-width="2" stroke-linejoin="round"/>
    <rect x="336" y="18" width="196" height="42" rx="18" fill="#ffffff" stroke="#3d7a4e" stroke-width="2"/>
    <text x="434" y="39" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="14.5" font-weight="600" fill="#22302a">候选词旁，有译文。</text>
    <text x="434" y="56" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#66736a">按 Tab 可上屏英文</text>
  </g>
</svg>
