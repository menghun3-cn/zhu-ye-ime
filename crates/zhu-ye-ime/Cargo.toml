[package]
name = "zhu-ye-ime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "竹叶输入法 TSF 输入法 DLL 与候选窗"

[lib]
# 仅 `cdylib` 供 TSF 宿主加载；T-081 起不再产出 `rlib`——设置窗口经独立的
# `zhu-ye-ui` crate 复用 UI 原语（S-10 收尾），本 crate 不再被任何库/二进制
# 静态链接。
crate-type = ["cdylib"]

[[bin]]
name = "candidate-demo"
path = "src/bin/candidate_demo.rs"

[[bin]]
name = "host-e2e"
path = "src/bin/host_e2e.rs"

[dependencies]
zhu-ye-core = { path = "../zhu-ye-core" }
zhu-ye-ui = { path = "../zhu-ye-ui" }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = { version = "0.61" }
