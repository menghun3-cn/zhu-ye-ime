[package]
name = "zhu-ye-settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "竹叶输入法设置窗口：工具箱、常用设置、关于与更新"

[lib]
name = "zhu_ye_settings"
path = "src/lib.rs"

[[bin]]
name = "zhu-ye-settings"
path = "src/main.rs"

[dependencies]
zhu-ye-core = { path = "../zhu-ye-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 复用 `candidate_ui` 的纯逻辑主题、度量与文本测量，避免同一项目出现第二套
# DPI/颜色语义（设计文档 §1）。代价是本 crate 会连带链接 TSF 侧代码；
# 抽取独立 UI 原语 crate 已记为后续任务（S-10）。
zhu-ye-ime = { path = "../zhu-ye-ime" }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
