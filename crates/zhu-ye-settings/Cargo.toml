[package]
name = "zhu-ye-settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "竹叶输入法设置窗口：工具箱、常用设置、关于与更新"

[lib]
name = "zhu_ye_settings"
path = "src/lib.rs"

[[bin]]
name = "zhu-ye-settings"
path = "src/main.rs"

[dependencies]
zhu-ye-core = { path = "../zhu-ye-core" }
# UI 原语来自独立纯逻辑 crate（T-081 / S-10）：本 crate 不再依赖 `zhu-ye-ime`
# 的 `rlib`，可执行文件不再连带链接 TSF 侧代码（input/tsf/词典加载）。
zhu-ye-ui = { path = "../zhu-ye-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
