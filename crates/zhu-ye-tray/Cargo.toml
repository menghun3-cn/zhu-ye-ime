[package]
name = "zhu-ye-tray"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "竹叶输入法系统托盘：中/英模式状态图标（T-112 后续批六）"

[[bin]]
name = "zhu-ye-tray"
path = "src/main.rs"

[dependencies]
zhu-ye-core = { path = "../zhu-ye-core" }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"
