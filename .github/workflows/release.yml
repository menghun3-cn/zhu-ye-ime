# 正式 Release 打包（发布分发闭环 CI 化，T-094 延伸）
#
# 触发：
#   - push tags "v*"：正式发布（git-publish 在 main 合入后打 tag），自动上传资产；
#   - workflow_dispatch：手动试跑（默认只构建+验证，不创建/上传 Release）。
#
# 链路（与本地 scripts/assemble-release.ps1 + verify-release-e2e.ps1 同一套逻辑）：
#   fetch-sources（pins 锁定校验）→ 全量词典构建 → 公钥注入构建引擎 →
#   私钥签名 manifest + verify 复核 → 组装 zip/SHA256SUMS → e2e 全链 →
#   gh release create/upload。
#
# 密钥：
#   ZHU_YE_RELEASE_SECRET_KEY  = Actions secret（私钥，别名运行时可见即可，绝不打印）
#   ZHU_YE_RELEASE_PUBLIC_KEY  = Actions variable（公钥，公开材料）
#   两者经环境变量传入，分别被 assemble-release.ps1 与 option_env! 消费。

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      upload:
        description: "上传资产到 GitHub Release（false = 只构建+验证）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  pack:
    runs-on: windows-latest
    env:
      ZHU_YE_RELEASE_PUBLIC_KEY: ${{ vars.ZHU_YE_RELEASE_PUBLIC_KEY }}
      ZHU_YE_RELEASE_SECRET_KEY: ${{ secrets.ZHU_YE_RELEASE_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 构建缓存
        uses: swatinem/rust-cache@v2

      - name: 数据源下载与锁定校验（data/pins→data/cache，含 bundle 抓取）
        shell: pwsh
        run: ./scripts/fetch-sources.ps1

      - name: CC-CEDICT 解压（cedict.ts.gz→cedict_ts.u8，构建链读取明文）
        shell: pwsh
        run: ./scripts/unpack-cedict.ps1

      - name: 英文词表 en.zyen（ECDICT 锁定 + 构建 + 性能验收）
        shell: pwsh
        run: ./scripts/build-en-wordbook.ps1

      - name: 基础包与领域包（base/it/med/slang）
        shell: pwsh
        run: |
          cargo run --release -p zhu-ye-dict -- build-base
          cargo run --release -p zhu-ye-dict -- build-pack it
          cargo run --release -p zhu-ye-dict -- build-pack med
          cargo run --release -p zhu-ye-dict -- build-slang

      - name: 组装发布资产（公钥注入构建 + 私钥签名 manifest + verify 复核 + zip + SHA256SUMS）
        shell: pwsh
        run: ./scripts/assemble-release.ps1

      - name: Inno Setup 安装（构建 exe 安装包所需，T-097）
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: 构建 exe 安装包（Inno 外壳复用 install.ps1，载荷与 zip 同 staging；T-097）
        shell: pwsh
        run: |
          $match = Select-String -LiteralPath 'Cargo.toml' -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if ($null -eq $match) { throw '无法读取 Cargo.toml version。' }
          $version = $match.Matches[0].Groups[1].Value
          $dir = "target/release-assets/$version"
          ./scripts/build-setup.ps1 `
            -OutputDir (Join-Path (Get-Location) $dir) `
            -Sha256File (Join-Path (Get-Location) "$dir/SHA256SUMS.txt")

      - name: 端到端验证（apply 落地 / 哈希一致 / 篡改自愈 / 篡改 manifest 拒绝）
        shell: pwsh
        run: ./scripts/verify-release-e2e.ps1

      - name: 上传到 GitHub Release（tag 触发或手动 upload 时）
        if: github.event_name == 'push' || inputs.upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 版本唯一源 = Cargo.toml workspace.package.version（与构建步骤一致）；
          # 不能用 github.ref_name——workflow_dispatch 时 ref_name 是 default 分支名。
          $match = Select-String -LiteralPath 'Cargo.toml' -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if ($null -eq $match) { throw '无法读取 Cargo.toml version。' }
          $version = $match.Matches[0].Groups[1].Value
          $dir = "target/release-assets/$version"
          if (-not (Test-Path -LiteralPath $dir -PathType Container)) {
            throw "发布资产目录缺失: $dir"
          }
          $assets = @(
            "$dir/SHA256SUMS.txt",
            "$dir/ai-zhu-ye-ime-$version.zip",
            "$dir/ai-zhu-ye-ime-setup-$version.exe",
            "$dir/packs/it.zyct",
            "$dir/packs/med.zyct",
            "$dir/packs/slang.zyct",
            "$dir/packs/manifest.json"
          )
          $tag = "v$version"
          $prerelease = if ($version -match '-') { '--prerelease' } else { '' }
          # 发布说明 = CHANGELOG 对应版本段的实际内容（不指向外部链接/占位）。
          $notesFile = "$dir/RELEASE_NOTES.md"
          & ./scripts/release-notes-from-changelog.ps1 -Version $version -NotesFile $notesFile
          if ($LASTEXITCODE -ne 0) { throw "生成发布说明失败" }
          # Release 可能已存在（重跑幂等）；失败忽略后走 upload --clobber。
          # 坑（2026-10-05 实测）：删除 tag 重打会使已发布的 release 被 GitHub
          # 置为 untagged + draft（tag 删除行为），create 幂等失败不会自动恢复——
          # 重打 tag 后必须手动 PATCH 恢复关联与发布状态：
          #   gh api -X PATCH repos/<owner>/<repo>/releases/<id> \
          #     -f tag_name=<tag> -F draft=false -F prerelease=false
          gh release create $tag --title $tag --notes-file $notesFile $prerelease --latest 2>$null
          gh release upload $tag @assets --clobber

      - name: 发布更新源镜像（zhu-ye-updates，T-098）
        if: github.event_name == 'push' || inputs.upload
        shell: pwsh
        env:
          ZHU_YE_UPDATES_TOKEN: ${{ secrets.ZHU_YE_UPDATES_TOKEN }}
        run: |
          # 版本统一读 Cargo.toml（同上传步骤；dispatch 时 ref_name 是分支名）。
          $match = Select-String -LiteralPath 'Cargo.toml' -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if ($null -eq $match) { throw '无法读取 Cargo.toml version。' }
          $version = $match.Matches[0].Groups[1].Value
          $packsDir = "target/release-assets/$version/packs"
          if (-not (Test-Path -LiteralPath "$packsDir\manifest.json" -PathType Leaf)) {
            throw "feed 文件缺失: $packsDir\manifest.json"
          }
          $token = $env:ZHU_YE_UPDATES_TOKEN
          if (-not $token) {
            # GITHUB_TOKEN 不能跨仓库；未配置 PAT 时跳过并告警（不阻塞主发布）。
            Write-Warning 'ZHU_YE_UPDATES_TOKEN 未配置（需要 zhu-ye-updates 的 contents:write 细粒度 PAT），跳过更新源镜像发布。'
            exit 0
          }
          $env:GH_TOKEN = $token
          $feedTag = "feed-v$version"
          # 不带 --target：主仓 commit 不是镜像仓对象，create 会 404 且被吞导致
          # upload 报 release not found（2026-10-05 修复）；默认落到镜像仓 main tip。
          gh release create $feedTag --repo menghun3-cn/zhu-ye-updates --title $feedTag --notes "竹叶输入法更新源 feed v$version (commit ${{ github.sha }})" 2>$null
          gh release upload $feedTag --repo menghun3-cn/zhu-ye-updates `
            "$packsDir\manifest.json" "$packsDir\it.zyct" "$packsDir\med.zyct" "$packsDir\slang.zyct" --clobber
          Write-Host "更新源镜像已发布: https://github.com/menghun3-cn/zhu-ye-updates/releases/tag/$feedTag"
